name: CI

on:
  push:
    branches: [main]
    # Tag de release (ex.: v0.1.0) publica as imagens também com o número da versão.
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formatação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: API carrega no runtime da Vercel (sem require de módulo ES)
        run: npm run check:serverless -w @devland/api
      # Regera o contrato a partir das rotas: se mudou, a API foi alterada sem atualizar o docs/openapi.yaml.
      - name: Contrato OpenAPI atualizado
        run: |
          npm run openapi -w @devland/api
          git diff --exit-code docs/openapi.yaml || {
            echo "::error file=docs/openapi.yaml::Contrato desatualizado: rode 'npm run openapi -w @devland/api' e commite o resultado."
            exit 1
          }
      - name: Lint do contrato OpenAPI (Redocly)
        run: npm run lint:openapi
      - name: Auditoria de dependências de produção (SCA)
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos dos testes da API
        run: npm run typecheck:test -w @devland/api
      # Os testes de integração sobem um Postgres descartável por arquivo (Testcontainers), com as
      # mesmas migrations da produção. O runner do GitHub já tem Docker.
      - name: Testes da API (unitários e de integração)
        run: npm run test:coverage -w @devland/api
      - name: Testes do site
        run: npm run test:coverage -w @devland/web
      - name: Resumo da cobertura
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Relatório de cobertura (HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 14

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A gitleaks-action exige licença em repositórios de organização; o binário oficial (MIT) não.
      # O checksum publicado na release garante que o arquivo baixado é o original.
      - name: Instala o gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${file}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar -xzf "${file}" gitleaks
      - name: Varre todo o histórico de commits
        run: ./gitleaks git --redact --no-banner --verbose .

  docker:
    name: Imagem ${{ matrix.app }}
    # Imagem só é construída (e publicada) depois de lint, testes e varredura de segredos.
    needs: [quality, test, secrets-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'devland' }}/devland-${{ matrix.app }}
      # Publica no Docker Hub em push na main ou em tag de release; em PR só constrói e escaneia.
      SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      # QEMU deixa o runner x64 gerar também a imagem arm64 (Mac com Apple Silicon, servidores ARM).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3333' }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Escaneia vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        if: env.SHOULD_PUSH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest = última versão da main; sha = versão exata de cada commit (permite rollback);
          # semver = versão da release (v0.1.0 vira 0.1.0 e 0.1), só em push de tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publica no Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3333' }}
          push: true
          # A mesma tag serve Windows/Linux x64 e Mac/Linux ARM: o Docker baixa a arquitetura certa.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  compose:
    name: Docker Compose (${{ matrix.arch }})
    needs: [quality, test, secrets-scan]
    # O "funciona na minha máquina" vira teste: o projeto recém-clonado, sem .env, sobe com um
    # comando em x64 (Windows, Linux) e em ARM (Mac com Apple Silicon, servidores ARM).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Sobe banco, API e site (espera todos ficarem saudáveis)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Confere que tudo responde
        run: |
          curl --fail --silent --show-error http://localhost:3333/health
          test "$(curl -fsS http://localhost:3333/products | jq length)" = 8
          curl -fsS http://localhost:8080/ | grep -q "<title>DevLand"
          wallet=$(curl -fsS -X POST http://localhost:3333/wallets | jq -r .id)
          curl -fsS -X POST -H "Content-Type: application/json" -d "{\"walletId\":\"$wallet\"}" \
            http://localhost:3333/quizzes/castor-do-cache/attempts | jq -e '.questions | length == 5'
      - name: Logs dos containers
        if: failure()
        run: docker compose logs
      - name: Derruba tudo
        if: always()
        run: docker compose down --volumes

  deploy:
    name: Deploy na Vercel (${{ github.event_name == 'pull_request' && 'preview' || 'produção' }})
    # Só publica depois de tudo verde: lint, testes, segredos, imagens e compose.
    needs: [quality, test, secrets-scan, docker, compose]
    # Preview em cada pull request do próprio repositório; produção a cada push na main.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.12.1
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      # "1" em produção; vazio no preview (os comandos usam ${PRODUCTION:+--prod}). A condição é
      # "push" porque, no GitHub Actions, "cond && '' || '1'" sempre dá '1': o vazio conta como falso.
      PRODUCTION: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Cada ambiente do GitHub guarda a conexão com o próprio banco (infra/set-github-secrets.sh).
      - name: Migrations no banco do ambiente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Segredo DATABASE_URL ausente no ambiente $TARGET. Rode sh infra/set-github-secrets.sh."
            exit 1
          fi
          npm run migrate -w @devland/api

      - name: Configuração e variáveis do projeto na Vercel
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build (site estático e função da API)
        run: npx --yes "$VERCEL_CLI" build ${PRODUCTION:+--prod} --token="$VERCEL_TOKEN"
      - name: Publica
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt ${PRODUCTION:+--prod} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deploy ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      # O deploy só conta como pronto se responder: saúde da API (com banco), catálogo e site.
      - name: Confere o deploy
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$URL/api/health"
          test "$(curl -fsS "$URL/api/products" | jq length)" = 8
          test "$(curl -fsS "$URL/api/quizzes" | jq length)" = 8
          curl -fsS "$URL/" | grep -q "<title>DevLand"

      # Deploy publicado mas sem responder: mostra os logs da função para entender o porquê.
      - name: Logs da função (se o deploy não respondeu)
        if: failure() && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes "$VERCEL_CLI" logs --deployment "$URL" --since 15m --limit 50 --token="$VERCEL_TOKEN"
