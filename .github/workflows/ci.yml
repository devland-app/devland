name: CI

on:
  push:
    branches: [main]
    # Tag de release (ex.: v0.1.0) publica as imagens também com o número da versão.
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formatação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Auditoria de dependências de produção (SCA)
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Imagem ${{ matrix.app }}
    needs: [quality, secrets-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'devzoo' }}/devzoo-${{ matrix.app }}
      # Publica no Docker Hub em push na main ou em tag de release; em PR só constrói e escaneia.
      SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3333' }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Escaneia vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        if: env.SHOULD_PUSH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest = última versão da main; sha = versão exata de cada commit (permite rollback);
          # semver = versão da release (v0.1.0 vira 0.1.0 e 0.1), só em push de tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publica no Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3333' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
