<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevLand: loja simulada de mascotes de massinha que explicam conceitos de DevOps. Nada é vendido nem cobrado."
    />
    <title>DevLand · loja simulada de mascotes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <!-- Aplica o tema salvo antes da primeira pintura, para a página não piscar no tema errado. -->
    <script>
      try {
        const theme = localStorage.getItem("devland-theme");
        if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
      } catch {
        /* sem armazenamento: segue o tema do sistema */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
