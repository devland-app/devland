<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb0f7" />
      <stop offset="1" stop-color="#9467d6" />
    </linearGradient>
    <radialGradient id="water" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#c9ecff" />
      <stop offset="1" stop-color="#58a9e6" />
    </radialGradient>
    <radialGradient id="sand" cx="40%" cy="20%" r="90%">
      <stop offset="0" stop-color="#fff1c9" />
