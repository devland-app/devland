# Desenvolvimento com recarga automática: npm run dev:docker
# (ou docker compose -f compose.dev.yaml up)
#
# O código da sua máquina é montado nos containers. Salvou um arquivo, a API reinicia sozinha (tsx
# watch) e a loja atualiza no navegador sem recarregar (Vite com hot reload).
# Loja em http://localhost:5173 · API em http://localhost:3333 · Swagger em /docs.
#
# Para rodar como em produção (imagens compiladas, nginx), use o docker-compose.yml. Os dois usam as
# portas 3333 e 5432: suba um de cada vez.
name: devland-dev

# Observa os arquivos por polling (a cada 300 ms). No Windows, com o repositório fora do WSL, os
# avisos de "arquivo mudou" não atravessam a pasta montada, e a recarga automática não veria nada.
x-polling: &polling
  CHOKIDAR_USEPOLLING: "true"
  CHOKIDAR_INTERVAL: "300"

x-node: &node
  image: node:22-alpine
  working_dir: /app
  volumes:
    - .:/app
    # node_modules ficam em volumes próprios: os da sua máquina (macOS/Windows) têm binários
    # nativos que não rodam no Linux do container.
    - node_modules:/app/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - api_node_modules:/app/apps/api/node_modules

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devland}
      POSTGRES_DB: ${POSTGRES_DB:-devland}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Instala as dependências uma vez, dentro do Linux do container, antes da API e da loja subirem.
  deps:
    <<: *node
    command: npm ci --ignore-scripts --no-audit --no-fund

  api:
    <<: *node
    command: npm run dev -w @devland/api
    environment:
      <<: *polling
      NODE_ENV: development
      PORT: ${API_PORT:-3333}
      DATABASE_URL: postgres://${POSTGRES_USER:-devland}:${POSTGRES_PASSWORD:-devland}@db:5432/${POSTGRES_DB:-devland}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "${API_PORT:-3333}:${API_PORT:-3333}"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    <<: *node
    # --host 0.0.0.0: sem isso o Vite só aceita conexões de dentro do próprio container.
    command: npm run dev -w @devland/web -- --host 0.0.0.0
    environment:
      <<: *polling
      VITE_API_URL: http://localhost:${API_PORT:-3333}
      VITE_FLAG_SHOWCASE_ANIMATIONS: ${VITE_FLAG_SHOWCASE_ANIMATIONS:-true}
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
  web_node_modules:
  api_node_modules:
