# Sobe a aplicação inteira: docker compose up --build
# Valores vêm do arquivo .env (copie de .env.example). Nada sensível fica aqui.

# Nome fixo do projeto: containers, volume e imagens saem como devland-*, em qualquer pasta.
name: devland

services:
  db:
    image: postgres:17-alpine
    # Os valores padrão existem para o projeto subir com um único comando em desenvolvimento.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devland}
      POSTGRES_DB: ${POSTGRES_DB:-devland}
    # Porta publicada só em 127.0.0.1: a API em modo dev (fora do Docker) e clientes SQL da própria
    # máquina alcançam o banco, mas ele não fica exposto para a rede.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    # Volume nomeado: os dados sobrevivem a "docker compose down" (só "down -v" apaga).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3333}
      DATABASE_URL: postgres://${POSTGRES_USER:-devland}:${POSTGRES_PASSWORD:-devland}@db:5432/${POSTGRES_DB:-devland}
      # Origens do front que podem chamar a API pelo navegador (nginx do compose e Vite em dev).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
    ports:
      - "${API_PORT:-3333}:${API_PORT:-3333}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
        VITE_FLAG_SHOWCASE_ANIMATIONS: ${VITE_FLAG_SHOWCASE_ANIMATIONS:-true}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Teste de fumaça de desempenho. Não sobe com o resto, só com o perfil "perf":
  #   docker compose --profile perf run --rm k6
  # Contra a produção, sem subir nada local: veja os comandos no começo de perf/smoke.js.
  k6:
    image: grafana/k6:1.4.2
    profiles: ["perf"]
    volumes:
      - ./perf:/perf:ro
    environment:
      BASE_URL: http://api:${API_PORT:-3333}
    command: ["run", "/perf/smoke.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
