# Sobe a aplicação inteira: docker compose up --build
# Valores vêm do arquivo .env (copie de .env.example). Nada sensível fica aqui.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3333}
    ports:
      - "${API_PORT:-3333}:${API_PORT:-3333}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
