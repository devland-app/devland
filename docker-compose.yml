# Sobe a aplicação inteira: docker compose up --build
# Valores vêm do arquivo .env (copie de .env.example). Nada sensível fica aqui.

services:
  db:
    image: postgres:17-alpine
    # Os valores padrão existem para o projeto subir com um único comando em desenvolvimento.
    # O banco não publica porta: só a API o acessa, pela rede interna do compose.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devzoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devzoo}
      POSTGRES_DB: ${POSTGRES_DB:-devzoo}
    # Volume nomeado: os dados sobrevivem a "docker compose down" (só "down -v" apaga).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3333}
      DATABASE_URL: postgres://${POSTGRES_USER:-devzoo}:${POSTGRES_PASSWORD:-devzoo}@db:5432/${POSTGRES_DB:-devzoo}
    ports:
      - "${API_PORT:-3333}:${API_PORT:-3333}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
