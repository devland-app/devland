openapi: 3.1.0
info:
  title: DevLand API
  version: 0.5.0
  description: "API da DevLand: quizzes de DevOps rendem moedas virtuais, e as
    moedas adotam mascotes que explicam cada conceito. As moedas não valem
    dinheiro e nada é cobrado."
components:
  schemas:
    Product:
      type: object
      description: Miniatura colecionável da vitrine
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - concept
        - description
        - priceCoins
        - stock
        - imageUrl
        - lesson
      properties:
        id:
          type: integer
          examples:
            - 1
        slug:
          type: string
          examples:
            - caranguejo-dos-conteineres
        name:
          type: string
          examples:
            - Caranguejo dos Contêineres
        concept:
          type: string
          description: Conceito de DevOps que inspirou o mascote
          examples:
            - Contêineres
        description:
          type: string
        priceCoins:
          type: integer
          description: Preço em moedas virtuais, ganhas nos quizzes. As moedas não valem
            dinheiro.
          examples:
            - 120
        stock:
          type: integer
          description: Unidades disponíveis
          examples:
            - 25
        imageUrl:
          type: string
          format: uri-reference
          description: Ilustração do mascote (SVG), relativa à URL da API. O parâmetro v
            muda sempre que o desenho muda, para o navegador não usar uma cópia
            antiga em cache.
          examples:
            - /images/mascots/caranguejo-dos-conteineres.svg?v=3f8c2a1e
        lesson:
          type: object
          description: O conceito de DevOps que o mascote ensina
          additionalProperties: false
          required:
            - explanation
            - realWorld
            - inProject
          properties:
            explanation:
              type: string
              description: O conceito em linguagem simples
            realWorld:
              type: string
              description: Um exemplo do dia a dia
            inProject:
              type: string
              description: Onde a própria DevLand aplica o conceito
    Wallet:
      type: object
      description: Carteira de moedas virtuais. As moedas não valem dinheiro.
      additionalProperties: false
      required:
        - id
        - balanceCoins
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Código da carteira. Sem login, é ele que dá acesso a ela.
        balanceCoins:
          type: integer
          minimum: 0
          examples:
            - 120
        createdAt:
          type: string
          format: date-time
    QuizSummary:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - concept
        - questionCount
        - totalCoins
        - earnedCoins
      properties:
        slug:
          type: string
          description: Mesmo slug do mascote do conceito
          examples:
            - caranguejo-dos-conteineres
        title:
          type: string
          examples:
            - O que são contêineres
        concept:
          type: string
          examples:
            - Contêineres
        questionCount:
          type: integer
          description: Perguntas por tentativa
          examples:
            - 5
        totalCoins:
          type: integer
          description: "Soma do que as perguntas pagam: o preço do mascote do conceito"
          examples:
            - 120
        earnedCoins:
          type: integer
          description: Quanto a carteira informada já ganhou neste quiz (0 sem carteira)
          examples:
            - 72
    QuizAttempt:
      type: object
      description: "Tentativa de quiz: as perguntas vêm sem a resposta certa."
      additionalProperties: false
      required:
        - id
        - quizSlug
        - title
        - concept
        - totalCoins
        - earnedCoins
        - questions
      properties:
        id:
          type: string
          format: uuid
          description: Código da tentativa
        quizSlug:
          type: string
        title:
          type: string
        concept:
          type: string
        totalCoins:
          type: integer
          examples:
            - 120
        earnedCoins:
          type: integer
          examples:
            - 72
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - prompt
              - options
              - coins
              - alreadyEarned
            properties:
              id:
                type: string
                examples:
                  - conteineres-2
              prompt:
                type: string
              options:
                type: array
                description: Em ordem embaralhada a cada tentativa
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - text
                  properties:
                    id:
                      type: string
                    text:
                      type: string
              coins:
                type: integer
                description: Moedas que o acerto paga
                examples:
                  - 24
              alreadyEarned:
                type: boolean
                description: "A carteira já recebeu as moedas desta pergunta: acertar de novo
                  não paga"
    QuizAnswerResult:
      type: object
      additionalProperties: false
      required:
        - correct
        - correctOptionId
        - explanation
        - coinsAwarded
        - alreadyEarned
        - balanceCoins
        - answeredCount
        - questionCount
      properties:
        correct:
          type: boolean
        correctOptionId:
          type: string
        explanation:
          type: string
          description: Por que a resposta certa é a certa
        coinsAwarded:
          type: integer
          examples:
            - 24
        alreadyEarned:
          type: boolean
          description: Acertou, mas as moedas desta pergunta já tinham sido ganhas antes
        balanceCoins:
          type: integer
          description: Saldo da carteira depois da resposta
        answeredCount:
          type: integer
          examples:
            - 3
        questionCount:
          type: integer
          examples:
            - 5
    OrderItem:
      type: object
      additionalProperties: false
      required:
        - productId
        - productName
        - unitPriceCoins
        - quantity
        - subtotalCoins
      properties:
        productId:
          type: integer
          examples:
            - 1
        productName:
          type: string
          examples:
            - Caranguejo dos Contêineres
        unitPriceCoins:
          type: integer
          description: Preço unitário no momento da adoção, em moedas
          examples:
            - 120
        quantity:
          type: integer
          examples:
            - 1
        subtotalCoins:
          type: integer
          examples:
            - 120
    Order:
      type: object
      description: Pedido de adoção, pago com moedas virtuais
      additionalProperties: false
      required:
        - id
        - status
        - items
        - totalCoins
        - createdAt
        - paidAt
      properties:
        id:
          type: string
          format: uuid
          description: Código do pedido. Sem login, é ele que dá acesso ao pedido.
        status:
          type: string
          enum:
            - awaiting_payment
            - paid
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalCoins:
          type: integer
          description: Total em moedas
          examples:
            - 200
        createdAt:
          type: string
          format: date-time
        paidAt:
          type:
            - "null"
            - string
          format: date-time
    Payment:
      type: object
      description: Pagamento aprovado, feito com moedas virtuais
      additionalProperties: false
      required:
        - id
        - method
        - status
        - amountCoins
        - receiptCode
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum:
            - coins
            - pix
            - toy_card
            - broke_toy_card
          description: "coins: moedas da carteira. pix, toy_card e broke_toy_card são
            formas simuladas de antes das moedas e só aparecem em pedidos
            antigos."
        status:
          type: string
          enum:
            - approved
        amountCoins:
          type: integer
          description: Moedas debitadas
          examples:
            - 200
        receiptCode:
          type: string
          description: Código do recibo
          examples:
            - DL-3F8C2A1E
        createdAt:
          type: string
          format: date-time
paths:
  /metrics:
    get:
      operationId: getMetrics
      summary: Métricas da API no formato do Prometheus
      tags:
        - health
      description: Duração das requisições por método, rota e status (taxa, erros e
        latência saem da mesma métrica), mais as métricas do processo Node. Na
        Vercel, cada instância da função tem os próprios contadores.
      responses:
        "200":
          description: Métricas no formato de texto do Prometheus
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      operationId: getHealth
      summary: Verifica se a API e o banco estão respondendo
      tags:
        - health
      responses:
        "200":
          description: API e banco saudáveis
          content:
            application/json:
              schema:
                description: API e banco saudáveis
                type: object
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  database:
                    type: string
                    enum:
                      - ok
                      - unavailable
        "503":
          description: Banco de dados indisponível
          content:
            application/json:
              schema:
                description: Banco de dados indisponível
                type: object
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  database:
                    type: string
                    enum:
                      - ok
                      - unavailable
  /products:
    get:
      operationId: listProducts
      summary: Lista as miniaturas da vitrine
      tags:
        - catalog
      responses:
        "200":
          description: Todas as miniaturas, ordenadas por ID
          content:
            application/json:
              schema:
                description: Todas as miniaturas, ordenadas por ID
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      summary: Detalha uma miniatura
      tags:
        - catalog
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          in: path
          name: id
          required: true
          description: ID do produto
      responses:
        "200":
          description: A miniatura encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: ID em formato inválido
          content:
            application/json:
              schema:
                description: ID em formato inválido
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhuma miniatura com esse ID
          content:
            application/json:
              schema:
                description: Nenhuma miniatura com esse ID
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /wallets:
    post:
      operationId: createWallet
      summary: Cria uma carteira de moedas vazia
      tags:
        - wallets
      description: "Sem login nem cadastro: o navegador guarda o código da carteira.
        As moedas entram por acertos nos quizzes e saem na adoção dos mascotes."
      responses:
        "201":
          description: Carteira criada, com saldo zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallets/{id}:
    get:
      operationId: getWallet
      summary: Consulta o saldo de uma carteira
      tags:
        - wallets
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Código da carteira
      responses:
        "200":
          description: A carteira
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          description: Código em formato inválido
          content:
            application/json:
              schema:
                description: Código em formato inválido
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhuma carteira com esse código
          content:
            application/json:
              schema:
                description: Nenhuma carteira com esse código
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /quizzes:
    get:
      operationId: listQuizzes
      summary: Lista os quizzes, um por conceito de DevOps
      tags:
        - quizzes
      description: Cada quiz paga, no total, o preço do mascote do conceito, e cada
        pergunta paga uma vez por carteira. Com a carteira informada, mostra
        quanto ela já ganhou em cada quiz.
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: walletId
          required: false
          description: Carteira para o progresso
      responses:
        "200":
          description: Quizzes disponíveis
          content:
            application/json:
              schema:
                description: Quizzes disponíveis
                type: array
                items:
                  $ref: "#/components/schemas/QuizSummary"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                description: Requisição inválida
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /quizzes/{slug}/attempts:
    post:
      operationId: startQuizAttempt
      summary: Começa uma tentativa de quiz
      tags:
        - quizzes
      description: Sorteia as perguntas e embaralha as opções. Dá para começar quantas
        tentativas quiser; cada pergunta rende moedas só no primeiro acerto da
        carteira.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - walletId
              properties:
                walletId:
                  type: string
                  format: uuid
                  description: Carteira que recebe as moedas
      parameters:
        - schema:
            type: string
            pattern: ^[a-z0-9-]+$
            maxLength: 60
          in: path
          name: slug
          required: true
      responses:
        "201":
          description: Tentativa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                description: Requisição inválida
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhum quiz com esse slug
          content:
            application/json:
              schema:
                description: Nenhum quiz com esse slug
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "422":
          description: Carteira não encontrada
          content:
            application/json:
              schema:
                description: Carteira não encontrada
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /quiz-attempts/{id}/answers:
    post:
      operationId: answerQuizQuestion
      summary: Responde uma pergunta da tentativa
      tags:
        - quizzes
      description: A API corrige, devolve a resposta certa com a explicação e, no
        primeiro acerto da carteira, credita as moedas da pergunta. Cada
        pergunta pode ser respondida uma vez por tentativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - questionId
                - optionId
              properties:
                questionId:
                  type: string
                  pattern: ^[a-z0-9-]+$
                  maxLength: 60
                optionId:
                  type: string
                  pattern: ^[a-f0-9]+$
                  maxLength: 20
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Código da tentativa
      responses:
        "200":
          description: Resposta corrigida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAnswerResult"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                description: Requisição inválida
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhuma tentativa com esse código
          content:
            application/json:
              schema:
                description: Nenhuma tentativa com esse código
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "409":
          description: Pergunta já respondida nesta tentativa
          content:
            application/json:
              schema:
                description: Pergunta já respondida nesta tentativa
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "422":
          description: Pergunta ou opção fora desta tentativa
          content:
            application/json:
              schema:
                description: Pergunta ou opção fora desta tentativa
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /orders:
    post:
      operationId: createOrder
      summary: Cria um pedido de adoção a partir do carrinho
      tags:
        - orders
      description: "Só produto e quantidade vêm do cliente: preços e nomes saem do
        catálogo. Repetir a mesma Idempotency-Key devolve o pedido já criado
        (200), sem criar outro."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 1
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 100
            pattern: ^[A-Za-z0-9_-]+$
          in: header
          name: idempotency-key
          required: true
          description: "Chave única por tentativa de compra (ex.: um UUID gerado no
            navegador)"
      responses:
        "200":
          description: Pedido já existente para esta Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                description: Requisição inválida
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "409":
          description: Estoque insuficiente
          content:
            application/json:
              schema:
                description: Estoque insuficiente
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "422":
          description: Produto inexistente ou acima do limite
          content:
            application/json:
              schema:
                description: Produto inexistente ou acima do limite
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Consulta um pedido pelo código
      tags:
        - orders
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Código do pedido
      responses:
        "200":
          description: O pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Código em formato inválido
          content:
            application/json:
              schema:
                description: Código em formato inválido
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhum pedido com esse código
          content:
            application/json:
              schema:
                description: Nenhum pedido com esse código
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
  /orders/{id}/payment:
    post:
      operationId: payOrder
      summary: Paga um pedido com as moedas de uma carteira
      tags:
        - orders
      description: As moedas são virtuais e não valem dinheiro. Baixa de estoque,
        débito das moedas e pedido pago acontecem juntos ou não acontecem. Pagar
        um pedido já pago devolve o mesmo recibo, sem debitar de novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - walletId
              properties:
                walletId:
                  type: string
                  format: uuid
                  description: Carteira que paga o pedido
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
          description: Código do pedido
      responses:
        "200":
          description: Pedido pago (ou já estava pago)
          content:
            application/json:
              schema:
                description: Pedido pago (ou já estava pago)
                type: object
                additionalProperties: false
                required:
                  - notice
                  - order
                  - payment
                properties:
                  notice:
                    type: string
                    examples:
                      - "Pago com moedas virtuais: nenhum dinheiro foi usado."
                  order:
                    $ref: "#/components/schemas/Order"
                  payment:
                    $ref: "#/components/schemas/Payment"
        "400":
          description: Requisição inválida
          content:
            application/json:
              schema:
                description: Requisição inválida
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "402":
          description: Pagamento recusado (saldo insuficiente)
          content:
            application/json:
              schema:
                description: Pagamento recusado (saldo insuficiente)
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "404":
          description: Nenhum pedido com esse código
          content:
            application/json:
              schema:
                description: Nenhum pedido com esse código
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
        "409":
          description: Um mascote do pedido esgotou
          content:
            application/json:
              schema:
                description: Um mascote do pedido esgotou
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Explicação do erro, pronta para mostrar na tela
servers:
  - url: http://localhost:3333
    description: Ambiente local (docker compose)
security: []
tags:
  - name: catalog
    description: Vitrine de mascotes
  - name: quizzes
    description: Quizzes que rendem moedas
  - name: wallets
    description: Carteiras de moedas virtuais
  - name: orders
    description: Pedidos de adoção, pagos com moedas
  - name: health
    description: Saúde da API e do banco
